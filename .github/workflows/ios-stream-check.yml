name: iOS stream check

# Loads every kind of YouTube Music page and downloads real songs with the iOS app's code from a GitHub runner (an ordinary public
# address), and prints what each YouTube client did.
on:
  push:
    branches: ["claude/ios-ipod"]
    paths: ["ios/Tempo/YouTube/**", "ios/StreamCheck/**", ".github/workflows/ios-stream-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download songs
        run: |
          mkdir -p /tmp/check
          cp ios/Tempo/YouTube/{JSONTree,TitleCleaner,SearchParser,HLSPlaylist,Catalog,YouTube}.swift ios/Tempo/App/Track.swift ios/StreamCheck/*.swift /tmp/check/
          cd /tmp/check
          swift --version
          swiftc -swift-version 5 *.swift -o check
          ./check
