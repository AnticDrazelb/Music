name: iOS stream check

# Downloads real songs with the iOS app's stream code from a GitHub runner (an ordinary public
# address), and prints what each YouTube client did.
on:
  push:
    branches: ["claude/ios-ipod"]
    paths: ["ios/Tempo/YouTube/**", "ios/StreamCheck/**", ".github/workflows/ios-stream-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download songs
        run: |
          mkdir -p /tmp/check
          cp ios/Tempo/YouTube/{JSONTree,TitleCleaner,SearchParser,HLSPlaylist}.swift ios/Tempo/App/Track.swift ios/StreamCheck/*.swift /tmp/check/
          (echo "import FoundationNetworking"; cat ios/Tempo/YouTube/YouTube.swift) > /tmp/check/YouTube.swift
          cd /tmp/check
          swift --version
          swiftc -swift-version 5 *.swift -o check
          ./check
